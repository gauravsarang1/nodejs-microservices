---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: media-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: workflow-service
  ports:
    - name: http
      port: 3004
      targetPort: 3004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: gauravsarang/nodejs-microservices:v3
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev:auth"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secrets
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
