
services:
  #==================================
  # KAFKA SERVICE
  #==================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: node-microservices-kafka
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - microservices-network
  
  # ==================================
  # AUTH SERVICE
  # ==================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:auth

    env_file:
      - .env

    ports:
      - "3001:3001"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/auth-service/node_modules

    networks:
      - microservices-network

    restart: unless-stopped


  # ==================================
  # TASK SERVICE
  # ==================================
  task-service:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:task

    env_file:
      - .env

    environment:
      KAFKA_BROKERS: kafka:9092

    ports:
      - "3002:3002"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/task-service/node_modules

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - microservices-network

    restart: unless-stopped


  # ==================================
  # MEDIA SERVICE
  # ==================================
  media-service:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:media

    env_file:
      - .env

    environment:
      KAFKA_BROKERS: kafka:9092

    ports:
      - "3003:3003"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/media-service/node_modules

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - microservices-network

    restart: unless-stopped

  # =================================
  # WORKFLOW SERVICE
  # =================================
  workflow-service:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:workflow

    env_file:
      - .env

    environment:
      KAFKA_BROKERS: kafka:9092

    ports:
      - "3004:3004"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/workflow-service/node_modules

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - microservices-network

    restart: unless-stopped

  # ==================================
  # DATABASE MIGRATIONS (run on demand)
  # ==================================
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run db:migrate

    env_file:
      - .env

    profiles:
      - tools

  # ==================================
  # API GATEWAY
  # ==================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:gateway

    env_file:
      - .env

    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      TASK_SERVICE_URL: http://task-service:3002
      MEDIA_SERVICE_URL: http://media-service:3003

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-gateway/node_modules

    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_started
      media-service:
        condition: service_started

    networks:
      - microservices-network

    restart: unless-stopped


# ==================================
# NETWORK
# ==================================
networks:
  microservices-network:
    driver: bridge
